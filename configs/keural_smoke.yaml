name: keural-smoke-test

# Tiny config purely for smoke-testing the training loop on machines
# without GPU or with limited memory. NOT for real training.
#
# Reference: docs/02_release_plan.md

stem:
  channels: [16, 32, 48, 64]
  kernel_size: 3
  activation: gelu

saliency:
  hidden_channels: 32

tokenizer:
  default_token_budget: 32
  max_token_budget: 128
  budget_split:
    global: 0.05
    region: 0.25
    detail: 0.70
  budget_floors:
    global: 4
    region: 8
    detail: 0
  saliency_smooth_kernel:
    region: 5
    detail: 3
  nms_radius:
    region: 2
    detail: 1
  gumbel_temperature_start: 1.0
  gumbel_temperature_end: 0.1
  temperature_anneal_steps: 100
  warmup_steps_fixed_grid: 5
  roi_align_size: 2

spatial:
  embed_dim: 64
  depth: 2
  num_heads: 4
  head_dim: 16
  mlp_ratio: 4
  norm_eps: 1.0e-6
  rope_base: 10000.0
  use_pool_token: true

loss:
  primary: sigmoid_siglip
  hct_alpha: 0.5
  saliency_beta: 0.01
  lambda_hct: 1.0
  lambda_sal: 1.0
  learnable_temperature_init: 2.30
  learnable_bias_init: -10.0

training:
  precision: float32
  gradient_checkpointing: false
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.05
  lr: 1.0e-3
  lr_schedule: cosine_with_warmup
  warmup_steps: 2
  max_steps: 5
  batch_size_per_device: 4
  gradient_accumulation: 1
  log_every: 1
  save_every: 100
  seed: 42

data:
  dataset_name: synthetic
  images_root: data/_smoke
  captions_path: data/_smoke/captions.tsv
  image_buckets:
    - [224, 224]
  pixel_mean: [0.485, 0.456, 0.406]
  pixel_std: [0.229, 0.224, 0.225]
  max_caption_length: 32
  num_workers: 0
  text_encoder_name: nonexistent/use-fallback
