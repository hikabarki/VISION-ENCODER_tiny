name: keural-tiny-poc

# This is the ~50-80M parameter POC config, intended to train in ~24-36
# hours on a single RTX 5090 (32 GB VRAM).
#
# Reference: docs/02_release_plan.md §3.1 "Stage 1 model specification".

stem:
  channels: [64, 128, 256, 384]
  kernel_size: 3
  activation: gelu

saliency:
  hidden_channels: 96

tokenizer:
  default_token_budget: 256
  max_token_budget: 1024
  budget_split:
    global: 0.05
    region: 0.25
    detail: 0.70
  budget_floors:
    global: 4
    region: 8
    detail: 0
  saliency_smooth_kernel:
    region: 5
    detail: 3
  nms_radius:
    region: 2
    detail: 1
  gumbel_temperature_start: 1.0
  gumbel_temperature_end: 0.1
  temperature_anneal_steps: 10000
  warmup_steps_fixed_grid: 5000
  roi_align_size: 2

spatial:
  # Tiny POC: D=384, 12 layers, 6 heads. ~50M params total.
  # NOTE: stem.channels[-1] must equal embed_dim — they're both 384 here.
  embed_dim: 384
  depth: 12
  num_heads: 6
  head_dim: 64
  mlp_ratio: 4
  norm_eps: 1.0e-6
  rope_base: 10000.0
  use_pool_token: true

loss:
  primary: sigmoid_siglip
  hct_alpha: 0.5
  saliency_beta: 0.01
  lambda_hct: 1.0
  lambda_sal: 1.0
  learnable_temperature_init: 2.30
  learnable_bias_init: -10.0

training:
  precision: bfloat16
  gradient_checkpointing: true
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.05
  lr: 1.0e-3
  lr_schedule: cosine_with_warmup
  warmup_steps: 2000
  max_steps: 75000
  batch_size_per_device: 256
  gradient_accumulation: 4
  log_every: 50
  save_every: 1000
  seed: 42

data:
  dataset_name: cc3m+cc12m
  images_root: data/cc3m
  captions_path: data/indexes/cc3m_wds_train.tsv
  extra_sources:
    - images_root: data/cc12m
      captions_path: data/indexes/cc12m_wds_train.tsv
  image_buckets:
    - [224, 224]
    - [256, 256]
    - [320, 320]
  pixel_mean: [0.485, 0.456, 0.406]
  pixel_std: [0.229, 0.224, 0.225]
  max_caption_length: 64
  num_workers: 4
  text_encoder_name: sentence-transformers/all-MiniLM-L6-v2
